<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" font-family="ui-monospace, monospace">
<rect width="760" height="408" fill="#0a0d12"/>
<text x="200" y="24" fill="#eff2f6" font-size="15" font-weight="600">Peso por categoría frente al presupuesto — RNF-07 a RNF-12</text><text x="200" y="42" fill="#82868e" font-size="11">Barra = % del presupuesto consumido · verde dentro, rojo fuera</text><text x="200" y="56" fill="#82868e" font-size="11">RNF-10, RNF-11 y RNF-12 sin material en dist/: no medibles, no &quot;0 KB&quot;</text><text x="190" y="107" fill="#eff2f6" font-size="12" font-weight="600" text-anchor="end">RNF-07</text><text x="190" y="121" fill="#82868e" font-size="10" text-anchor="end">HTML + CSS + JS</text><rect x="200" y="97" width="536" height="15" fill="#1d2229" rx="2"/><rect x="200" y="97" width="536" height="15" fill="#e5484d" rx="2" opacity="0.9"/><text x="736" y="109" fill="#eff2f6" font-size="11" font-weight="600" text-anchor="end">4.8 / 350 KB</text><text x="190" y="121" fill="#e5484d" font-size="10" text-anchor="end">1.4%</text><text x="190" y="153" fill="#eff2f6" font-size="12" font-weight="600" text-anchor="end">RNF-08</text><text x="190" y="167" fill="#82868e" font-size="10" text-anchor="end">JavaScript</text><rect x="200" y="143" width="536" height="15" fill="#1d2229" rx="2"/><rect x="200" y="143" width="2" height="15" fill="#46a758" rx="2" opacity="0.9"/><text x="736" y="155" fill="#eff2f6" font-size="11" font-weight="600" text-anchor="end">0 / 110 KB</text><text x="190" y="167" fill="#46a758" font-size="10" text-anchor="end">0.0%</text><text x="190" y="199" fill="#eff2f6" font-size="12" font-weight="600" text-anchor="end">RNF-09</text><text x="190" y="213" fill="#82868e" font-size="10" text-anchor="end">CSS</text><rect x="200" y="189" width="536" height="15" fill="#1d2229" rx="2"/><rect x="200" y="189" width="536" height="15" fill="#e5484d" rx="2" opacity="0.9"/><text x="736" y="201" fill="#eff2f6" font-size="11" font-weight="600" text-anchor="end">2.6 / 24 KB</text><text x="190" y="213" fill="#e5484d" font-size="10" text-anchor="end">10.8%</text><text x="190" y="245" fill="#eff2f6" font-size="12" font-weight="600" text-anchor="end">RNF-10</text><text x="190" y="259" fill="#82868e" font-size="10" text-anchor="end">Webfonts</text><rect x="200" y="235" width="536" height="15" fill="none" stroke="#383d47" stroke-width="1" stroke-dasharray="3 3"/><text x="208" y="247" fill="#82868e" font-size="11">sin material en dist/ — n/m</text><text x="190" y="291" fill="#eff2f6" font-size="12" font-weight="600" text-anchor="end">RNF-11</text><text x="190" y="305" fill="#82868e" font-size="10" text-anchor="end">Imagen</text><rect x="200" y="281" width="536" height="15" fill="none" stroke="#383d47" stroke-width="1" stroke-dasharray="3 3"/><text x="208" y="293" fill="#82868e" font-size="11">sin material en dist/ — n/m</text><text x="190" y="337" fill="#eff2f6" font-size="12" font-weight="600" text-anchor="end">RNF-12</text><text x="190" y="351" fill="#82868e" font-size="10" text-anchor="end">Vídeo</text><rect x="200" y="327" width="536" height="15" fill="none" stroke="#383d47" stroke-width="1" stroke-dasharray="3 3"/><text x="208" y="339" fill="#82868e" font-size="11">sin material en dist/ — n/m</text><text x="200" y="388" fill="#82868e" font-size="10">Fuente: datos-estatico.json · gzip · budgets de scripts/gate-budgets.mjs</text><text x="200" y="402" fill="#82868e" font-size="10">Los presupuestos en KB son el techo; el % es lo consumido. KB no lleva LCI: son bytes, no una muestra.</text>
</svg>
